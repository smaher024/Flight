<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flight</title>
    <!-- Discord preview -->
  <meta property="og:title" content="Flight" />
  <meta property="og:description" content="" />
  <meta property="og:image" content="https://madebymalice.com/Logo.png" />
  <meta name="twitter:image" content="https://madebymalice.com/Logo.png" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />

  <style>
    body {
      background-color: #0d1117 !important;
      color: #e1e1e1 !important;
      margin: 0;
      padding: 0;
    }
  </style>
</head>
<body>

  <!-- audio stuff -->
  <audio id="bg-music" loop>
    <source src="../assets/ambient_2.mp3" type="audio/mpeg">
  </audio>

<!-- Music Control Button & Volume Slider Panel -->
<div style="position: fixed; bottom: 24px; right: 24px; z-index: 9999; display: flex; flex-direction: column; align-items: flex-end; gap: 8px;">
    <a href="https://pixabay.com" target="_blank" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 0.75rem; color: #8b949e; text-decoration: none; background-color: rgba(13, 17, 23, 0.85); padding: 4px 8px; border: 1px solid #30363d; border-radius: 4px;">🎵 Music by Tumetank</a>
    
    <div style="background-color: rgba(21, 27, 38, 0.85); border: 1px solid #30363d; padding: 10px 16px; border-radius: 20px; display: flex; align-items: center; gap: 12px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;">
        <button id="music-btn" onclick="toggleMusic()" style="background: none; color: #8b949e; border: none; padding: 0; cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 1rem;">
            <span>🔈</span><span id="btn-text">Play Ambient Track</span>
        </button>
        <!-- Volume Slider (Starts at 30% volume) -->
        <input type="range" id="volume-slider" min="0" max="1" step="0.05" value="0.3" oninput="changeVolume(this.value)" style="width: 80px; accent-color: #58a6ff; cursor: pointer;">
    </div>
</div>


  
  <!-- Main Content Grid Wrapper -->
<div style="display: grid; grid-template-columns: 1fr; width: 100%; justify-items: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; line-height: 1.8; padding: 40px 0; gap: 60px;">

    <!-- panel 15 -->
    <div style="width: 100%; max-width: 1100px; padding: 0 20px;">
        <div style="text-align: center;">
            <img src="../assets/15_Rocket.png" alt="View" style="width: 100%; height: auto; border-radius: 6px; display: block;">
        </div>
        <div style="max-width: 750px; margin: 40px auto 0 auto;">
            <p style="text-align: justify; font-size: 1.1rem; margin: 0;">
                Text goes here please, and thank you.
            </p>
        </div>
    </div>

    <!-- panel 17 -->
    <div style="width: 100%; max-width: 1100px; padding: 0 20px;">
        <div style="text-align: center;">
            <img src="../assets/17_Butte.png" alt="View" style="width: 100%; height: auto; border-radius: 6px; display: block;">
        </div>
        <div style="max-width: 750px; margin: 40px auto 0 auto;">
            <p style="text-align: justify; font-size: 1.1rem; margin: 0;">
                Text 2
            </p>
        </div>
    </div>

</div>

          
          
    <!-- Audio Script Functionality -->
<script>
    const music = document.getElementById('bg-music');
    const btnText = document.getElementById('btn-text');
    const btnIcon = document.querySelector('#music-btn span');
    
    // Set default volume to 30% so it doesn't blast the reader
    music.volume = 0.3;

    function toggleMusic() {
        if (music.paused) {
            music.play();
            btnIcon.textContent = '🔊';
            btnText.textContent = 'Pause Ambient Track';
        } else {
            music.pause();
            btnIcon.textContent = '🔈';
            btnText.textContent = 'Play Ambient Track';
        }
    }

    function changeVolume(amount) {
        music.volume = amount;
    }
</script>
